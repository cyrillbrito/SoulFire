name: Feature request
description: Propose an improvement and explain the problem it solves.
labels: ["type: :bulb: enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case before the implementation. Small, focused proposals are easier to discuss.
        For desktop GUI features, use [SoulFireClient issues](https://github.com/soulfiremc-com/SoulFireClient/issues).
        For usage questions, use [support resources](https://github.com/soulfiremc-com/SoulFire/blob/main/SUPPORT.md).
  - type: checkboxes
    id: existing-requests
    attributes:
      label: Existing proposals
      options:
        - label: I searched open and closed issues for similar proposals.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain who needs this change, what they want to do, and what prevents them today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired result. Include an example of the workflow, command, or API if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe existing features, plugins, SDK scripts, or workarounds you considered and their limits.
  - type: textarea
    id: scope
    attributes:
      label: Scope and compatibility
      description: Name affected components and any effect on existing users, plugins, SDKs, permissions, or performance.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, references, or mockups. Mention if you want to help implement or test the proposal.
