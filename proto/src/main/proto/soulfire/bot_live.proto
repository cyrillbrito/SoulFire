    option (soulfire.v1.api_method) = {
      display_name: "Respond to resource pack"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
    };
  }

  rpc SetFlying (SetFlyingRequest) returns (SetFlyingResponse) {
    option (google.api.http) = { post: "/v1/instances/{instance_id}/bots/{bot_id}:setFlying" body: "*" };
    option (soulfire.v1.api_method) = {
      display_name: "Set flying state"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
    };
  }

  // Requests survival-mode elytra flight. Minecraft validates that the bot is
  // falling and has usable elytra equipment.
  rpc StartElytraFlight (StartElytraFlightRequest) returns (StartElytraFlightResponse) {
    option (google.api.http) = { post: "/v1/instances/{instance_id}/bots/{bot_id}/elytra:start" body: "*" };
    option (soulfire.v1.api_method) = {
      display_name: "Start elytra flight"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online and airborne. Minecraft validates elytra equipment."
      execution: "Completes after the fall-flying request is submitted on the bot game thread."
    };
  }

  rpc SetCreativeSlot (SetCreativeSlotRequest) returns (SetCreativeSlotResponse) {
    option (google.api.http) = { post: "/v1/instances/{instance_id}/bots/{bot_id}/creative-slot:set" body: "*" };
    option (soulfire.v1.api_method) = {
      display_name: "Set creative slot"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
    };
  }

  // Waits until every chunk in a square radius around the bot is loaded.
  rpc WaitForChunks (WaitForChunksRequest) returns (WaitForChunksResponse) {
    option (google.api.http) = { post: "/v1/instances/{instance_id}/bots/{bot_id}/chunks:wait" body: "*" };
    option (soulfire.v1.api_method) = {
      display_name: "Wait for chunks"
      permissions: "READ_BOT_INFO"
      scope: "instance.bot"
      preconditions: "Bot must be online and have a loaded client level."
      execution: "Polls the bot world view until the requested chunk square is loaded or the deadline expires."
    };
  }

  // Requests the bot to pathfind to a goal. Returns a stream of progress
  // events terminating with COMPLETED, FAILED, or CANCELLED. A new GoTo for
  // the same bot supersedes any in-progress pathfinding; the previous stream
  // is closed with CANCELLED.
  rpc GoTo (GoToRequest) returns (stream PathfindProgress) {
    option (soulfire.v1.api_method) = {
      display_name: "Pathfind to goal"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      execution: "Starts a pathfinding session that streams progress updates."
      side_effects: "Drives bot movement until the goal is reached, aborted, or cancelled."
    };
  }

  // Cancels any in-progress pathfinding session for this bot.
  rpc StopPathfinding (StopPathfindingRequest) returns (StopPathfindingResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/pathfind:stop"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Stop pathfinding"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      execution: "Immediate"
      side_effects: "Cancels any in-progress pathfinding session for this bot."
    };
  }

  // Acquires exclusive action control for a bot. While the lease is active,
  // action calls must include its token in the X-SoulFire-Control-Token
  // request header.
  rpc AcquireBotControl (AcquireBotControlRequest) returns (AcquireBotControlResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/control:acquire"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Acquire bot control"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      side_effects: "Prevents other clients from issuing actions until the lease is released or expires."
    };
  }

  rpc RenewBotControl (RenewBotControlRequest) returns (RenewBotControlResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/control:renew"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Renew bot control"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
    };
  }

  rpc ReleaseBotControl (ReleaseBotControlRequest) returns (ReleaseBotControlResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/control:release"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Release bot control"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
    };
  }
}
