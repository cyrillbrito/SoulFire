// ============================================================================
// Pathfinding
// ============================================================================

// A pathfinding destination. Exactly one variant must be set.
message PathfindGoal {
  // Reach a specific block within `radius` blocks (euclidean).
  message BlockGoal {
    BlockPosition position = 1 [(google.api.field_behavior) = REQUIRED];
    // Acceptable distance from `position` at which to consider the goal
    // reached. 0 means "stand on the block".
    float radius = 2;
  }
  // Reach a world position within `radius` blocks.
  message NearGoal {
    WorldPosition position = 1 [(google.api.field_behavior) = REQUIRED];
    float radius = 2;
  }
  // Reach the current location of an entity, within `radius` blocks.
  // The path will be updated as the entity moves (follow behavior).
  message EntityGoal {
    int32 entity_id = 1 [(google.api.field_behavior) = REQUIRED];
    float radius = 2;
    optional string connection_epoch = 3 [(soulfire.v1.api_field).format = "uuid"];
  }
  // Reach an XZ column, ignoring Y.
  message XZGoal {
    double x = 1 [(google.api.field_behavior) = REQUIRED];
    double z = 2 [(google.api.field_behavior) = REQUIRED];
    string dimension = 3;
    float radius = 4;
  }
  // Reach a Y level while allowing the planner to choose X and Z.
  message YGoal {
    int32 y = 1 [(google.api.field_behavior) = REQUIRED];
    string dimension = 2;
  }
  // Reach and break one exact block.
  message BreakBlockGoal {
    BlockPosition position = 1 [(google.api.field_behavior) = REQUIRED];
  }
  // Reach and place the currently selected placeable item at one exact block.
  message PlaceBlockGoal {
    BlockPosition position = 1 [(google.api.field_behavior) = REQUIRED];
  }
  // Move until the bot is at least `radius` blocks away from a position.
  message AwayFromPositionGoal {
    WorldPosition position = 1 [(google.api.field_behavior) = REQUIRED];
    float radius = 2 [(google.api.field_behavior) = REQUIRED];
  }
  // Move until the bot is at least `radius` blocks away from an entity.
  message AwayFromEntityGoal {
    int32 entity_id = 1 [(google.api.field_behavior) = REQUIRED];
    float radius = 2 [(google.api.field_behavior) = REQUIRED];
    optional string connection_epoch = 3 [(soulfire.v1.api_field).format = "uuid"];
  }
  // Complete when any nested goal is reached.
  message AnyGoal {
    repeated PathfindGoal goals = 1 [(google.api.field_behavior) = REQUIRED];
  }
  oneof goal {
    BlockGoal block = 1;
    NearGoal near = 2;
    EntityGoal entity = 3;
    XZGoal xz = 4;
    YGoal y = 5;
    BreakBlockGoal break_block = 6;
    PlaceBlockGoal place_block = 7;
    AwayFromPositionGoal away_from_position = 8;
    AwayFromEntityGoal away_from_entity = 9;
    AnyGoal any = 10;
  }
}

enum PathfindSearchMode {
  PATHFIND_SEARCH_MODE_UNSPECIFIED = 0;
  // Exact A* through ARA* with epsilon fixed at 1.0.
  PATHFIND_SEARCH_MODE_PRECISION = 1;
  // ARA* starting at epsilon 2.5 and repairing to a 1.2 bound by default.
  PATHFIND_SEARCH_MODE_NORMAL = 2;
  // ARA* starting at epsilon 3.0 and repairing to a 1.5 bound by default.
  PATHFIND_SEARCH_MODE_URGENT = 3;
  // ARA* starting at epsilon 4.0 and repairing to a 2.0 bound by default.
  PATHFIND_SEARCH_MODE_ESCAPE = 4;
}

message PathfindOptions {
  // If true, the bot may break blocks along the path when necessary.
  bool allow_mining = 1;
  // If true, the bot may place blocks (e.g. bridge, pillar) when necessary.
  bool allow_placing = 2;
  // Maximum wall-clock seconds for planning + traversal. 0 means server default.
  int32 timeout_seconds = 3;
  // Overrides the server's path search timeout. 0 means server default.
  uint32 search_timeout_seconds = 4;
  // Extra planner cost for breaking a block. Unset uses server settings.
  optional double break_block_penalty = 5;
  // Extra planner cost for placing a block. Unset uses server settings.
  optional double place_block_penalty = 6;
  // If true, candidate movements whose feet or head would enter fluid are
  // excluded from the route. Unset uses the bot's pathfinding settings.
  optional bool avoid_fluids = 7;
  // Additional block item ids that pathfinding may place after exhausting its
  // built-in disposable building blocks. This is request-scoped and should be
  // used sparingly for recovery paths that would otherwise leave a bot
  // stranded.
  repeated string additional_place_item_ids = 8;
  // Whether ordinary forward path traversal should sprint. Unset preserves the
  // server default of sprinting. Set false for hunger-efficient travel.
  optional bool sprint = 9;
  // Optional inclusive elevation bounds for the bot's feet along the route.
  // These keep a route on the surface or within a mining layer without
  // constraining blocks that actions may reach from the route.
  optional int32 minimum_y = 10;
  optional int32 maximum_y = 11;
  // Search quality and latency policy. Unset uses NORMAL.
  PathfindSearchMode search_mode = 12;
  // Largest accepted certified multiplicative quality bound. Values must be
  // from 1.0 through the selected mode's initial epsilon. Unset uses the mode
  // default. ARA* does not execute an incumbent that misses this bound.
  optional double maximum_quality_bound = 13;
  // Smooth camera movement only inside movement-specific safe tolerances.
  // Block interactions and precision movement remain deterministic.
  optional bool smooth_camera = 14;
  // Hard state-expansion budget for the complete ARA* repair session. 0 uses
  // the server default. Reaching this limit is reported separately from an
  // unreachable goal.
  uint32 maximum_expanded_states = 15;
  // Largest ordinary fall onto solid ground. Values above 3 are rejected
  // because longer falls require a dedicated safe-landing primitive.
  optional uint32 maximum_fall_distance = 16;
  // Largest unsupported horizontal gap that parkour may cross. Set to 0 to
  // disable parkour. Values above 3 are rejected by the current controller.
  optional uint32 maximum_parkour_gap = 17;
  // Blocks the route may move around but must never break. Positions in a
  // different dimension are rejected instead of being silently reinterpreted
  // in the bot's current dimension.
  repeated BlockPosition protected_blocks = 18;
}

message GoToRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  PathfindGoal goal = 3 [(google.api.field_behavior) = REQUIRED];
  PathfindOptions options = 4;
}

// Status of a pathfinding attempt.
enum PathfindStatus {
  PATHFIND_STATUS_UNSPECIFIED = 0;
  // Planning has started; no path yet.
  PATHFIND_STATUS_PLANNING = 1;
  // A path was found and traversal has started.
  PATHFIND_STATUS_MOVING = 2;
  // The goal was reached.
  PATHFIND_STATUS_COMPLETED = 3;
  // No path could be found (unreachable) or a timeout / obstacle aborted
  // traversal. See `error` for detail.
  PATHFIND_STATUS_FAILED = 4;
  // Aborted by the client via StopPathfinding.
  PATHFIND_STATUS_CANCELLED = 5;
}

message PathfindProgress {
  PathfindStatus status = 1 [(google.api.field_behavior) = REQUIRED];
  // Remaining straight-line distance to the goal in blocks, if known.
  optional float distance_remaining = 2;
  // Current bot position, populated on MOVING updates.
  optional WorldPosition position = 3;
  // Present when status is FAILED. Human-readable failure reason.
  optional string error = 4;
  string action_id = 5 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
}

message StopPathfindingRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
}

message StopPathfindingResponse {
}

// Exclusive control lease for coordinating multiple SDK clients, scripts, and
// independent SDK controllers and server tasks against the same bot.
message AcquireBotControlRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  // Requested lease lifetime. The server clamps this to its configured range.
  uint32 ttl_seconds = 3;
}

message BotControlLease {
  string token = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp expires_at = 2 [(google.api.field_behavior) = REQUIRED];
}

message AcquireBotControlResponse {
  BotControlLease lease = 1 [(google.api.field_behavior) = REQUIRED];
}

message RenewBotControlRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string token = 3 [(google.api.field_behavior) = REQUIRED];
  uint32 ttl_seconds = 4;
}

message RenewBotControlResponse {
  BotControlLease lease = 1 [(google.api.field_behavior) = REQUIRED];
}

message ReleaseBotControlRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string token = 3 [(google.api.field_behavior) = REQUIRED];
}

message ReleaseBotControlResponse {
}

// ============================================================================
// Service
// ============================================================================

// Live bot remote-control service. See file header for scope and design notes.
//
// Permissions:
// - READ_BOT_INFO: required for WatchBotEvents, GetBlock, FindBlocks,
//                  ListNearbyEntities.
// - CONTROL_BOT_ACTIONS: required for chat, interactions, pathfinding, and
//                        exclusive control leases.
//
// Error handling mirrors BotService:
// - NOT_FOUND: instance or bot does not exist.
// - FAILED_PRECONDITION: bot is not online, target not loaded, or the
//                        requested action is not currently valid.
// - OUT_OF_RANGE: target is outside the bot's reach / observation radius.
// - INTERNAL: unexpected server errors.
service BotLiveService {
  // Subscribes to a single multiplexed event stream for one bot. The first
  // message is always the current BotStatus. The stream remains open while the
  // bot is stopped and follows the configured bot across reconnects. Live
  // snapshots and filtered events begin whenever a connection becomes ready.
  rpc WatchBotEvents (WatchBotEventsRequest) returns (stream BotEvent) {
    option (soulfire.v1.api_method) = {
      display_name: "Watch bot events"
      permissions: "READ_BOT_INFO"
      scope: "instance.bot"
      execution: "Opens a live event stream until the client cancels or the account is removed."
      side_effects: "Allocates server-side subscription resources for the bot."
    };
  }

  // Sends a chat message (or slash command) from the bot to the connected
  // Minecraft server. Messages prefixed with "/" are routed as commands.
  rpc SendChat (SendChatRequest) returns (SendChatResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/chat:send"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Send chat"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      execution: "Completes after the message has been submitted on the bot game thread."
      side_effects: "Transmits the message to the Minecraft server."
    };
  }

  // Returns the block at a world position, if the chunk is loaded.
  rpc GetBlock (GetBlockRequest) returns (GetBlockResponse) {
    option (google.api.http) = {
      get: "/v1/instances/{instance_id}/bots/{bot_id}/live/world/block"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Get block"
      permissions: "READ_BOT_INFO"
      scope: "instance.bot"
      preconditions: "Bot must be online."
    };
  }

  // Finds blocks of the given ids within a radius of the bot. Results are
  // sorted by ascending distance.
  rpc FindBlocks (FindBlocksRequest) returns (FindBlocksResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/live/world/blocks:find"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Find blocks"
      permissions: "READ_BOT_INFO"
      scope: "instance.bot"
      preconditions: "Bot must be online."
    };
  }

  // Lists entities within a radius of the bot, optionally filtered by type.
  rpc ListNearbyEntities (ListNearbyEntitiesRequest) returns (ListNearbyEntitiesResponse) {
    option (google.api.http) = {
      get: "/v1/instances/{instance_id}/bots/{bot_id}/live/world/entities"
    };
    option (soulfire.v1.api_method) = {
      display_name: "List nearby entities"
      permissions: "READ_BOT_INFO"
      scope: "instance.bot"
      preconditions: "Bot must be online."
    };
  }

  // Starts (or stops, when `cancel` is set) breaking a block at a specific
  // position. Unlike MouseClick, the target is explicit, with no raytrace from
  // the current look direction is performed.
  rpc DigBlock (DigBlockRequest) returns (DigBlockResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions/dig"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Dig block"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      preconditions: "Target block must be within reach and loaded."
      execution: "Completes when the block is broken, cancelled, or the action fails."
      side_effects: "Breaks or cancels breaking the target block."
    };
  }

  // Places the currently held item as a block, against a specific face of a
  // specific block.
  rpc PlaceBlock (PlaceBlockRequest) returns (PlaceBlockResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions/place"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Place block"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      preconditions: "Target adjacent position must be within reach and loaded."
      execution: "Immediate"
      side_effects: "Attempts to place the held item as a block."
    };
  }

  // Activates a specific block face without assigning placement semantics to
  // the operation. This covers doors, buttons, beds, redstone controls, and
  // modded interactive blocks.
  rpc InteractBlock (InteractBlockRequest) returns (InteractBlockResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions/interact-block"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Interact with block"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      preconditions: "Target block must be loaded and within reach."
      execution: "Immediate"
      side_effects: "Activates the selected block face and may use the held item."
    };
  }

  // Uses the item in the specified hand (eat, drink, throw, draw bow, etc.).
  rpc UseItem (UseItemRequest) returns (UseItemResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions/use-item"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Use item"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      execution: "Immediate"
      side_effects: "Triggers the held item's use behaviour."
    };
  }

  // Releases an item that is currently being used, such as firing a drawn bow
  // or stopping eating.
  rpc ReleaseItem (ReleaseItemRequest) returns (ReleaseItemResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions/release-item"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Release item"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      execution: "Completes after the release is performed on the bot game thread."
    };
  }

  // Attacks a specific entity by network id.
  rpc AttackEntity (AttackEntityRequest) returns (AttackEntityResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions/attack"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Attack entity"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      preconditions: "Target entity must be observable and within reach."
      execution: "Immediate"
      side_effects: "Swings the main hand and damages the target entity."
    };
  }

  // Right-clicks / interacts with a specific entity by network id. Used for
  // trading with villagers, mounting mobs, etc.
  rpc InteractEntity (InteractEntityRequest) returns (InteractEntityResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions/interact"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Interact with entity"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      preconditions: "Target entity must be observable and within reach."
      execution: "Immediate"
      side_effects: "Sends an interaction packet for the target entity."
    };
  }

  // Swings the specified arm without a target (visual animation only).
  rpc SwingArm (SwingArmRequest) returns (SwingArmResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions/swing"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Swing arm"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online."
      execution: "Immediate"
      side_effects: "Sends an arm swing animation packet."
    };
  }

  // Respawns a dead bot or dismisses the End credits to finish respawning.
  rpc Respawn (RespawnRequest) returns (RespawnResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions:respawn"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Respawn bot"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online and either dead or viewing the End credits."
      execution: "Completes after the respawn request is sent."
    };
  }

  // Uses a reachable bed and completes only after the server confirms that the
  // bot entered the sleeping state.
  rpc Sleep (SleepRequest) returns (SleepResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions:sleep"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Sleep in bed"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online and the target must be a reachable bed."
      execution: "Completes when the server confirms sleep or the action times out."
      side_effects: "Interacts with the bed and changes the bot sleeping state."
    };
  }

  // Leaves the current bed.
  rpc Wake (WakeRequest) returns (WakeResponse) {
    option (google.api.http) = {
      post: "/v1/instances/{instance_id}/bots/{bot_id}/actions:wake"
      body: "*"
    };
    option (soulfire.v1.api_method) = {
      display_name: "Wake from bed"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      preconditions: "Bot must be online and sleeping."
      execution: "Completes after the wake request is sent."
      side_effects: "Leaves the current bed."
    };
  }

  rpc MountEntity (MountEntityRequest) returns (MountEntityResponse) {
    option (google.api.http) = { post: "/v1/instances/{instance_id}/bots/{bot_id}:mount" body: "*" };
    option (soulfire.v1.api_method) = {
      display_name: "Mount entity"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
      side_effects: "Interacts with a rideable entity and waits for server confirmation."
    };
  }

  rpc Dismount (DismountRequest) returns (DismountResponse) {
    option (google.api.http) = { post: "/v1/instances/{instance_id}/bots/{bot_id}:dismount" body: "*" };
    option (soulfire.v1.api_method) = {
      display_name: "Dismount"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
    };
  }

  rpc SetVehicleControl (SetVehicleControlRequest) returns (SetVehicleControlResponse) {
    option (google.api.http) = { post: "/v1/instances/{instance_id}/bots/{bot_id}/vehicle:control" body: "*" };
    option (soulfire.v1.api_method) = {
      display_name: "Set vehicle control"
      permissions: "CONTROL_BOT_ACTIONS"
