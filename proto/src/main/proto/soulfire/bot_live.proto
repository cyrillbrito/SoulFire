    option (google.api.http) = { post: "/v1/instances/{instance_id}/bots/{bot_id}/sign:update" body: "*" };
    option (soulfire.v1.api_method) = {
      display_name: "Update sign"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
    };
  }

  rpc WriteBook (WriteBookRequest) returns (WriteBookResponse) {
    option (google.api.http) = { post: "/v1/instances/{instance_id}/bots/{bot_id}/book:write" body: "*" };
    option (soulfire.v1.api_method) = {
      display_name: "Write book"
      permissions: "CONTROL_BOT_ACTIONS"
      scope: "instance.bot"
