syntax = "proto3";

option java_package = "com.soulfiremc.grpc.generated";
option java_multiple_files = true;

package soulfire.v1;

import "soulfire/api_docs.proto";
import "soulfire/bot.proto";
import "soulfire/common.proto";
import "soulfire/domain.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// ============================================================================
// BotLiveService - Streaming Events, Interactions, and Pathfinding
// ============================================================================
//
// BotLiveService is the remote-control API surface for SoulFire bots. It
// complements BotService (which is polling/snapshot oriented) by providing:
//
// - A single streaming event channel per bot (state deltas, chat, lifecycle,
//   entities, block updates) so remote controllers don't need to poll.
// - High-level imperative actions (dig, place, attack, use, interact) that
//   target specific coordinates or entity ids rather than relying on the bot's
//   current look direction.
// - World queries (block lookup, block search, nearby entities) against the
//   bot's loaded world view.
// - Pathfinding as a streaming RPC: submit a goal, receive progress/completion
//   events.
//
// The service is intended to make SoulFire feel like a library from the
// caller's perspective (mineflayer/azalea style) while keeping the server
// authoritative.
//
// All RPCs require READ_BOT_INFO (for reads and event streams) or
// CONTROL_BOT_ACTIONS (for actions) on the owning instance.
// ============================================================================

// The face of a block that an action targets. Used when placing a block or
// right-clicking a block with an item to indicate which side the player is
// interacting with.
enum BlockFace {
  BLOCK_FACE_UNSPECIFIED = 0;
  BLOCK_FACE_DOWN = 1;
  BLOCK_FACE_UP = 2;
  BLOCK_FACE_NORTH = 3;
  BLOCK_FACE_SOUTH = 4;
  BLOCK_FACE_WEST = 5;
  BLOCK_FACE_EAST = 6;
}

// Which hand to use for an action. Mirrors Minecraft's main-hand / off-hand
// distinction.
enum Hand {
  HAND_UNSPECIFIED = 0;
  HAND_MAIN = 1;
  HAND_OFF = 2;
}

// A block observed in the bot's world view, including its type and runtime
// property state (e.g. "facing": "north", "waterlogged": "true").
message BlockState {
  // The block position.
  BlockPosition position = 1 [(google.api.field_behavior) = REQUIRED];
  // The namespaced block id (e.g. "minecraft:oak_log").
  string block_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Flattened block state properties (name -> value) for the block. Empty for
  // blocks with no variants.
  map<string, string> properties = 3;
}

// A brief summary of an entity in the bot's world view. Intended for use as
// a repeated item in list responses and streaming events.
message NearbyEntity {
  // The numeric network entity id assigned by the server.
  // Use this to target the entity in AttackEntity / InteractEntity.
  int32 entity_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The namespaced entity type (e.g. "minecraft:zombie", "minecraft:player").
  string entity_type = 2 [(google.api.field_behavior) = REQUIRED];
  // Current world position of the entity.
  WorldPosition position = 3 [(google.api.field_behavior) = REQUIRED];
  // Straight-line distance from the bot, in blocks.
  float distance = 4 [(google.api.field_behavior) = REQUIRED];
  // Display name if the entity has one. For players this is the username.
  optional string display_name = 5;
  // True if this entity is a player.
  bool is_player = 6;
  // Current health, if known. Not populated for entities without a health
  // attribute or when the bot cannot observe it.
  optional float health = 7;
}

// ============================================================================
// Event stream
// ============================================================================

// Options controlling which categories of events are delivered by
// WatchBotEvents. Each category is opt-in; a stream with no categories
// enabled still emits the initial snapshot and then stays silent.
message BotEventFilter {
  // Deliver position / rotation / health / food / xp / dimension / game mode
  // changes as BotStateDelta.
  bool include_state_deltas = 1;
  // Deliver incoming chat and system messages as BotChatEvent.
  bool include_chat = 2;
  // Deliver connect / disconnect / spawn / death / respawn events as
  // BotLifecycleEvent.
  bool include_lifecycle = 3;
  // Deliver entity spawn / update / despawn within entity_radius as
  // BotEntityEvent. Setting this without a positive radius defaults to 32
  // blocks to keep the stream manageable.
  bool include_entity_events = 4;
  // Maximum radius (blocks) for entity events. Ignored if
  // include_entity_events is false. Server clamps to a sane upper bound.
  float entity_radius = 5;
  // Deliver block change events within block_radius around the bot as
  // BotBlockUpdateEvent. Setting this without a positive radius defaults to
  // 16 blocks.
  bool include_block_updates = 6;
  // Maximum radius (blocks) for block updates. Ignored if
  // include_block_updates is false. Server clamps to a sane upper bound.
  float block_radius = 7;
  // Deliver inventory and open-container snapshots when their state changes.
  bool include_inventory = 8;
  // Deliver explicit damage events.
  bool include_damage = 9;
  // Deliver world clock, weather, and other server game-state changes.
  bool include_environment = 10;
  // Deliver tab-list additions, removals, and metadata updates.
  bool include_player_list = 11;
  // Deliver boss-bar lifecycle and property updates.
  bool include_boss_bars = 12;
  // Deliver sound playback and stop events.
  bool include_sounds = 13;
  // Deliver particle spawn events.
  bool include_particles = 14;
  // Deliver objectives, scores, display slots, and team updates.
  bool include_scoreboard = 15;
  // Deliver server resource-pack offers and removals.
  bool include_resource_packs = 16;
  // Deliver title, subtitle, timing, clear, and reset events.
  bool include_titles = 17;
  // Deliver chunk-column load and unload events. This can be a high-volume
  // stream while the bot is moving, so it is not enabled by default.
  bool include_chunks = 18;
}

// Request to subscribe to a bot's live event stream.
message WatchBotEventsRequest {
  // Owning instance UUID.
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  // Target bot profile UUID.
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  // Which event categories to include in the stream.
  BotEventFilter filter = 3 [(google.api.field_behavior) = REQUIRED];
  // Last sequence confirmed by the caller. When the requested event is no
  // longer resumable the server emits a resync_required event followed by a
  // fresh snapshot.
  uint64 after_sequence = 4;
  // Stream epoch associated with after_sequence.
  optional string stream_epoch = 5 [(soulfire.v1.api_field).format = "uuid"];
  // Requested heartbeat interval. The server clamps this to its supported
  // range. Zero selects the server default.
  uint32 heartbeat_interval_seconds = 6;
}

// Partial update to the bot's live state. Only fields present have changed
// since the last delta or snapshot. Clients should merge deltas onto their
// local copy of BotLiveState.
message BotStateDelta {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
  optional float x_rot = 4;
  optional float y_rot = 5;
  optional float health = 6;
  optional float max_health = 7;
  optional int32 food_level = 8;
  optional float saturation_level = 9;
  optional int32 selected_hotbar_slot = 10;
  optional string dimension = 11;
  optional int32 experience_level = 12;
  optional float experience_progress = 13;
  optional GameMode game_mode = 14;
}

// Source of a chat message.
enum ChatSource {
  CHAT_SOURCE_UNSPECIFIED = 0;
  // Sent by another player (player chat).
  CHAT_SOURCE_PLAYER = 1;
  // Server-wide broadcast or system announcement.
  CHAT_SOURCE_SYSTEM = 2;
  // Action bar overlay (the thin strip above the hotbar).
  CHAT_SOURCE_ACTION_BAR = 3;
  // Whisper directed at this bot.
  CHAT_SOURCE_WHISPER = 4;
  // The client received a message but Minecraft did not expose reliable
  // source metadata for it.
  CHAT_SOURCE_UNKNOWN = 5;
}

// A single chat or system message observed by the bot.
message BotChatEvent {
  // Where the message came from.
  ChatSource source = 1 [(google.api.field_behavior) = REQUIRED];
  // Plain-text rendering of the message with formatting codes stripped.
  // Stable across Minecraft versions; suitable for pattern matching.
  string plain_text = 2 [(google.api.field_behavior) = REQUIRED];
  // Original JSON text component for callers that need formatting, colors,
  // click events, or translation keys. Present when available from the server.
  optional string json_component = 3;
  // Sender display name for PLAYER and WHISPER sources.
  optional string sender_name = 4;
  // Sender profile UUID for PLAYER and WHISPER sources, when resolvable.
  optional string sender_id = 5;
  // Server-side timestamp at which the message was received.
  google.protobuf.Timestamp received_at = 6;
}

// Lifecycle event kind for the bot's Minecraft session.
enum BotLifecycleKind {
  BOT_LIFECYCLE_UNSPECIFIED = 0;
  BOT_LIFECYCLE_CONNECTING = 1;
  BOT_LIFECYCLE_CONNECTED = 2;
  BOT_LIFECYCLE_SPAWNED = 3;
  BOT_LIFECYCLE_DIED = 4;
  BOT_LIFECYCLE_RESPAWNED = 5;
  BOT_LIFECYCLE_DISCONNECTED = 6;
}

// Lifecycle event for the bot's connection and player state.
message BotLifecycleEvent {
  BotLifecycleKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  // Free-form detail message (disconnect reason, death message, etc.).
  optional string message = 2;
}

// Entity event kind.
enum EntityEventKind {
  ENTITY_EVENT_UNSPECIFIED = 0;
  // Entity entered the bot's observation radius.
  ENTITY_EVENT_SPAWN = 1;
  // Entity metadata or position updated.
  ENTITY_EVENT_UPDATE = 2;
  // Entity left the observation radius or was removed.
  ENTITY_EVENT_DESPAWN = 3;
}

// An entity change within the bot's observation radius.
message BotEntityEvent {
  EntityEventKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  // Entity summary at the time of the event. For DESPAWN, only entity_id is
  // guaranteed to be populated.
  NearbyEntity entity = 2 [(google.api.field_behavior) = REQUIRED];
  // Full semantic entity state at the time of the event. Present for spawn
  // and update events. A despawn uses `entity` as its stable tombstone.
  optional EntitySnapshot snapshot = 3;
}

// A block change observed within the bot's block radius.
message BotBlockUpdateEvent {
  BlockPosition position = 1 [(google.api.field_behavior) = REQUIRED];
  // Previous block id, if the client tracked it. Can be empty on initial
  // observation.
  string old_block_id = 2;
  // New block id after the change.
  string new_block_id = 3 [(google.api.field_behavior) = REQUIRED];
  // Full semantic block state after the change, including properties,
  // lighting, fluid, mining hints, and interaction metadata.
  optional BlockSnapshot block = 4;
}

// Current inventory or open-container state after a change.
message BotInventoryEvent {
  BotInventoryStateResponse state = 1 [(google.api.field_behavior) = REQUIRED];
}

// Damage observed by the bot.
message BotDamageEvent {
  float previous_health = 1 [(google.api.field_behavior) = REQUIRED];
  float health = 2 [(google.api.field_behavior) = REQUIRED];
  float amount = 3 [(google.api.field_behavior) = REQUIRED];
}

message ClockSnapshot {
  string clock_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 total_ticks = 2;
  float partial_tick = 3;
  float rate = 4;
}

message BotTimeEvent {
  int64 game_time = 1;
  repeated ClockSnapshot clocks = 2;
}

enum WeatherEventKind {
  WEATHER_EVENT_UNSPECIFIED = 0;
  WEATHER_EVENT_STARTED_RAINING = 1;
  WEATHER_EVENT_STOPPED_RAINING = 2;
  WEATHER_EVENT_RAIN_LEVEL_CHANGED = 3;
  WEATHER_EVENT_THUNDER_LEVEL_CHANGED = 4;
}

message BotWeatherEvent {
  WeatherEventKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  optional float level = 2;
}

message BotGameEvent {
  // Stable snake-case event name, such as `immediate_respawn`.
  string event = 1 [(google.api.field_behavior) = REQUIRED];
  float parameter = 2;
}

message BotEnvironmentEvent {
  oneof change {
    BotTimeEvent time = 1;
    BotWeatherEvent weather = 2;
    BotGameEvent game_event = 3;
  }
}

message PlayerListEntrySnapshot {
  string profile_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  optional string profile_name = 2;
  bool listed = 3;
  int32 latency_ms = 4;
  GameMode game_mode = 5;
  optional TextComponent display_name = 6;
  bool show_hat = 7;
  int32 list_order = 8;
  // Packet actions applied to this entry, such as `add_player` or
  // `update_latency`. This lets consumers distinguish an omitted value from
  // a value that was not part of the update.
  repeated string changed_fields = 9;
}

enum PlayerListEventKind {
  PLAYER_LIST_EVENT_UNSPECIFIED = 0;
  PLAYER_LIST_EVENT_UPSERT = 1;
  PLAYER_LIST_EVENT_REMOVE = 2;
}

message BotPlayerListEvent {
  PlayerListEventKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  repeated PlayerListEntrySnapshot entries = 2;
  repeated string removed_profile_ids = 3 [(soulfire.v1.api_field).format = "uuid"];
}

enum BossBarEventKind {
  BOSS_BAR_EVENT_UNSPECIFIED = 0;
  BOSS_BAR_EVENT_ADD = 1;
  BOSS_BAR_EVENT_REMOVE = 2;
  BOSS_BAR_EVENT_UPDATE_PROGRESS = 3;
  BOSS_BAR_EVENT_UPDATE_NAME = 4;
  BOSS_BAR_EVENT_UPDATE_STYLE = 5;
  BOSS_BAR_EVENT_UPDATE_PROPERTIES = 6;
}

message BotBossBarEvent {
  string boss_bar_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  BossBarEventKind kind = 2 [(google.api.field_behavior) = REQUIRED];
  optional TextComponent name = 3;
  optional float progress = 4;
  optional string color = 5;
  optional string overlay = 6;
  optional bool darken_screen = 7;
  optional bool play_music = 8;
  optional bool create_world_fog = 9;
}

enum SoundEventKind {
  SOUND_EVENT_UNSPECIFIED = 0;
  SOUND_EVENT_PLAY_AT_POSITION = 1;
  SOUND_EVENT_PLAY_AT_ENTITY = 2;
  SOUND_EVENT_STOP = 3;
}

message BotSoundEvent {
  SoundEventKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  optional string sound_id = 2;
  optional string source = 3;
  optional WorldPosition position = 4;
  optional int32 entity_id = 5;
  optional float volume = 6;
  optional float pitch = 7;
  optional int64 seed = 8;
}

message BotParticleEvent {
  string particle_id = 1 [(google.api.field_behavior) = REQUIRED];
  WorldPosition position = 2 [(google.api.field_behavior) = REQUIRED];
  Vec3 offset = 3;
  float max_speed = 4;
  int32 count = 5;
  bool always_show = 6;
  bool override_limiter = 7;
  // Version-specific particle options rendered as a diagnostic string.
  optional string options = 8;
}

enum ScoreboardEventKind {
  SCOREBOARD_EVENT_UNSPECIFIED = 0;
  SCOREBOARD_EVENT_OBJECTIVE_ADD = 1;
  SCOREBOARD_EVENT_OBJECTIVE_REMOVE = 2;
  SCOREBOARD_EVENT_OBJECTIVE_UPDATE = 3;
  SCOREBOARD_EVENT_DISPLAY_OBJECTIVE = 4;
  SCOREBOARD_EVENT_SCORE_SET = 5;
  SCOREBOARD_EVENT_SCORE_RESET = 6;
  SCOREBOARD_EVENT_TEAM_ADD = 7;
  SCOREBOARD_EVENT_TEAM_REMOVE = 8;
  SCOREBOARD_EVENT_TEAM_UPDATE = 9;
  SCOREBOARD_EVENT_TEAM_PLAYERS_ADD = 10;
  SCOREBOARD_EVENT_TEAM_PLAYERS_REMOVE = 11;
}

message BotScoreboardEvent {
  ScoreboardEventKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  optional string objective_name = 2;
  optional TextComponent display_name = 3;
  optional string render_type = 4;
  optional string display_slot = 5;
  optional string owner = 6;
  optional int32 score = 7;
  optional string team_name = 8;
  repeated string players = 9;
  optional TextComponent prefix = 10;
  optional TextComponent suffix = 11;
  optional string color = 12;
  optional string name_tag_visibility = 13;
  optional string collision_rule = 14;
  optional bool allow_friendly_fire = 15;
  optional bool see_friendly_invisibles = 16;
}

enum ResourcePackEventKind {
  RESOURCE_PACK_EVENT_UNSPECIFIED = 0;
  RESOURCE_PACK_EVENT_OFFERED = 1;
  RESOURCE_PACK_EVENT_REMOVED = 2;
  RESOURCE_PACK_EVENT_CLEARED = 3;
}

message BotResourcePackEvent {
  ResourcePackEventKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  optional string pack_id = 2 [(soulfire.v1.api_field).format = "uuid"];
  optional string url = 3;
  optional string hash = 4;
  optional bool required = 5;
  optional TextComponent prompt = 6;
}

enum TitleEventKind {
  TITLE_EVENT_UNSPECIFIED = 0;
  TITLE_EVENT_TITLE = 1;
  TITLE_EVENT_SUBTITLE = 2;
  TITLE_EVENT_TIMES = 3;
  TITLE_EVENT_CLEAR = 4;
  TITLE_EVENT_RESET = 5;
}

message BotTitleEvent {
  TitleEventKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  optional TextComponent text = 2;
  optional int32 fade_in_ticks = 3;
  optional int32 stay_ticks = 4;
  optional int32 fade_out_ticks = 5;
}

enum ChunkEventKind {
  CHUNK_EVENT_UNSPECIFIED = 0;
  CHUNK_EVENT_LOAD = 1;
  CHUNK_EVENT_UNLOAD = 2;
}

message BotChunkEvent {
  ChunkEventKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  int32 chunk_x = 2 [(google.api.field_behavior) = REQUIRED];
  int32 chunk_z = 3 [(google.api.field_behavior) = REQUIRED];
  string dimension = 4 [(google.api.field_behavior) = REQUIRED];
}

// Metadata shared by every event emitted on a bot stream.
message BotEventEnvelope {
  string bot_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string stream_epoch = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  uint64 sequence = 3 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp observed_at = 4 [(google.api.field_behavior) = REQUIRED];
  uint64 snapshot_revision = 5 [(google.api.field_behavior) = REQUIRED];
  optional string causation_id = 6 [(soulfire.v1.api_field).format = "uuid"];
  optional string task_id = 7 [(soulfire.v1.api_field).format = "uuid"];
}

// Signals that continuity could not be preserved and the caller must replace
// its synchronized state with the snapshots that follow.
message BotResyncRequired {
  string reason = 1 [(google.api.field_behavior) = REQUIRED];
  optional string requested_epoch = 2 [(soulfire.v1.api_field).format = "uuid"];
  uint64 requested_after_sequence = 3;
}

// Keeps idle streams observable and allows clients to detect dead transports.
message BotHeartbeat {}

// A single message on the bot event stream.
message BotEvent {
  oneof event {
    // Initial snapshot or periodic resync. Sent once on stream open and any
    // time the server detects the client's view may have diverged.
    BotLiveState snapshot = 1;
    BotStateDelta state_delta = 2;
    BotChatEvent chat = 3;
    BotLifecycleEvent lifecycle = 4;
    BotEntityEvent entity_event = 5;
    BotBlockUpdateEvent block_update = 6;
    // Persistent desired state and controller state. This is emitted first and
    // whenever it changes, including while the bot is offline or reconnecting.
    BotStatus status = 7;
    BotInventoryEvent inventory = 8;
    BotDamageEvent damage = 9;
    BotResyncRequired resync_required = 10;
    BotHeartbeat heartbeat = 11;
    BotEnvironmentEvent environment = 12;
    BotPlayerListEvent player_list = 13;
    BotBossBarEvent boss_bar = 14;
    BotSoundEvent sound = 15;
    BotParticleEvent particle = 16;
    BotScoreboardEvent scoreboard = 17;
    BotResourcePackEvent resource_pack = 18;
    BotTitleEvent title = 19;
    BotChunkEvent chunk = 21;
  }
  BotEventEnvelope envelope = 20 [(google.api.field_behavior) = REQUIRED];
}

// Final outcome of an imperative bot action.
enum BotActionStatus {
  BOT_ACTION_STATUS_UNSPECIFIED = 0;
  BOT_ACTION_STATUS_COMPLETED = 1;
  BOT_ACTION_STATUS_CANCELLED = 2;
  BOT_ACTION_STATUS_FAILED = 3;
}

message BotActionResult {
  string action_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  BotActionStatus status = 2 [(google.api.field_behavior) = REQUIRED];
  optional string error = 3;
}

// ============================================================================
// Chat
// ============================================================================

message SendChatRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  // The chat message to send. Treated as a literal chat message. To execute a
  // slash command, include the leading "/"; the server will route it
  // appropriately.
  string message = 3 [(google.api.field_behavior) = REQUIRED];
}

message SendChatResponse {
  BotActionResult result = 1 [(google.api.field_behavior) = REQUIRED];
}

// ============================================================================
// World queries
// ============================================================================

message GetBlockRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  BlockPosition position = 3 [(google.api.field_behavior) = REQUIRED];
}

message GetBlockResponse {
  // True if the chunk containing the requested position is loaded for this
  // bot. When false, the block field is not populated.
  bool loaded = 1 [(google.api.field_behavior) = REQUIRED];
  // The observed block state. Absent when loaded is false.
  optional BlockState block = 2;
}

message FindBlocksRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  // Block ids to match (namespaced, e.g. "minecraft:diamond_ore"). A block
  // matches if its id equals any entry in this list.
  repeated string block_ids = 3 [(google.api.field_behavior) = REQUIRED];
  // Maximum search radius in blocks, measured from the bot's current block
  // position. Server clamps to an implementation-defined maximum.
  int32 max_distance = 4 [(google.api.field_behavior) = REQUIRED];
  // Maximum number of matches to return. Results are ordered by ascending
  // distance from the bot.
  int32 max_count = 5 [(google.api.field_behavior) = REQUIRED];
}

message FindBlocksResponse {
  repeated BlockState blocks = 1;
}

message ListNearbyEntitiesRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  // Maximum radius in blocks from the bot. Server clamps to an
  // implementation-defined maximum.
  float radius = 3 [(google.api.field_behavior) = REQUIRED];
  // Optional filter: if non-empty, only entities whose namespaced type is in
  // this list are returned.
  repeated string entity_types = 4;
  // If true, include players in the result. Defaults to true.
  bool include_players = 5;
}

message ListNearbyEntitiesResponse {
  // Entities ordered by ascending distance from the bot.
  repeated NearbyEntity entities = 1;
}

// ============================================================================
// Imperative actions
// ============================================================================

message DigBlockRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  // Block to break. Must be within reach of the bot.
  BlockPosition position = 3 [(google.api.field_behavior) = REQUIRED];
  // If true, cancel an in-progress dig on this block instead of starting one.
  bool cancel = 4;
}

message DigBlockResponse {
  BotActionResult result = 1 [(google.api.field_behavior) = REQUIRED];
}

message PlaceBlockRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  // The block the bot is placing against (the block being clicked).
  BlockPosition against = 3 [(google.api.field_behavior) = REQUIRED];
  // Which face of `against` is being clicked. The new block is placed adjacent
  // to that face.
  BlockFace face = 4 [(google.api.field_behavior) = REQUIRED];
  // Which hand holds the item being placed.
  Hand hand = 5 [(google.api.field_behavior) = REQUIRED];
}

message PlaceBlockResponse {
  BotActionResult result = 1 [(google.api.field_behavior) = REQUIRED];
}

message InteractBlockRequest {
  string instance_id = 1 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  string bot_id = 2 [(google.api.field_behavior) = REQUIRED, (soulfire.v1.api_field).format = "uuid"];
  // Block to activate. Must be loaded and within interaction reach.
  BlockPosition position = 3 [(google.api.field_behavior) = REQUIRED];
  // Face to click.
  BlockFace face = 4 [(google.api.field_behavior) = REQUIRED];
